<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | Node</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/favicon-180.png" />
<style>
  .not-found {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .not-found-inner { max-width: 480px; }
  .not-found-code {
    font-family: var(--font-display);
    font-size: clamp(5rem, 20vw, 9rem);
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 40px rgba(63, 196, 91, 0.3);
  }
  .not-found h2 { font-size: 1.75rem; margin-bottom: 1rem; }
  .not-found p { margin-bottom: 2rem; }
  .not-found-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="badge-mark" viewBox="0 0 48 48" fill="none">
        <path d="M24 4 L42 11 V22 C42 33 34.5 41 24 44 C13.5 41 6 33 6 22 V11 Z" fill="#3fc45b" stroke="#14181a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M16 24 L21.5 29.5 L33 17" stroke="#14181a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      Node
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="contact.html" class="nav-cta">Contact</a></li>
    </ul>
  </div>
</nav>

<main class="not-found">
  <div class="not-found-inner">
    <div class="not-found-code">404</div>
    <h2>Nothing here</h2>
    <p>That page doesn't exist — it may have moved, or the link was wrong. Head back home or check the blog.</p>
    <div class="not-found-actions">
      <a href="index.html" class="btn btn-primary">Go home</a>
      <a href="blog.html" class="btn btn-ghost">Read the blog</a>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
